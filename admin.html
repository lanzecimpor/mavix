<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Administrador | MAVIX</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛍️</text></svg>">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f1f6f5;--sf:#fff;--ink:#0f2421;--mu:#587570;--ln:#d5e4e1;--br:#0f766e;--bi:#fff;--ac:#f59e0b;--ok:#15803d;--chip:#dff0ed;
font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#0b1716;--sf:#12231f;--ink:#e8f5f2;--mu:#8fb0aa;--ln:#25403b;--br:#2dd4bf;--bi:#04201c;--chip:#1d3732}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);line-height:1.4}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--sf);z-index:20}
button,input,select,textarea{font:inherit;color:inherit}
header{background:var(--sf);border-bottom:1px solid var(--ln)}
.w{max-width:1000px;margin:0 auto;padding:0 12px}
.top{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;padding:10px 0}
.logo{font-weight:800;font-size:1.45rem;letter-spacing:-.04em;color:var(--br);margin-right:auto;text-decoration:none}.logo b{color:var(--ac)}
.b{border:0;border-radius:10px;padding:8px 12px;font-size:.88rem;font-weight:700;cursor:pointer;background:var(--chip);white-space:nowrap;text-decoration:none;color:var(--ink);display:inline-block}
.b.p{background:var(--br);color:var(--bi)}.b.a{background:var(--ac);color:#241700}.b.s{padding:5px 10px;font-size:.8rem}.b.d{background:#c62828;color:#fff}
.b:disabled{opacity:.6;cursor:wait}
:is(button,input,select,textarea,a):focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.pill{font-size:.72rem;background:var(--chip);border-radius:99px;padding:3px 9px;font-weight:700}
.pill.ok{background:var(--ok);color:#fff}.pill.wt{background:var(--ac);color:#241700}.pill.no{background:#c62828;color:#fff}
.bar{display:flex;gap:8px;padding-bottom:8px}
.bar input,.bar select,.f input,.f select,.f textarea,.in{background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:9px 11px;min-width:0;width:100%}
.bar input{flex:1}.bar select{width:auto;max-width:42%}
.cats{display:flex;gap:4px;overflow-x:auto;padding-bottom:9px;scrollbar-width:none}
.cat{border:0;background:var(--chip);border-radius:7px;padding:3px 9px;font-size:.76rem;cursor:pointer;white-space:nowrap;font-weight:600}
.cat[aria-pressed="true"]{background:var(--br);color:var(--bi)}
.cnt{color:var(--mu);font-size:.85rem;margin:12px 0 8px}
.g{display:grid;gap:8px;grid-template-columns:repeat(2,minmax(0,1fr));padding-bottom:40px}
.cd{background:var(--sf);border:1px solid var(--ln);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.ph{height:96px;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:2rem;position:relative}
.ph[data-id]{cursor:pointer}.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tg{position:absolute;left:5px;top:5px;font-size:.62rem;font-weight:800;background:var(--ac);color:#241700;padding:1px 7px;border-radius:99px}
.ph i{position:absolute;right:5px;bottom:5px;background:#000a;color:#fff;font-style:normal;font-size:.62rem;padding:1px 7px;border-radius:99px}
.bd{padding:7px 9px 4px;display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.bd h3{margin:0;font-size:.84rem;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bd p{display:none;margin:0;color:var(--mu);font-size:.82rem}
.pr{font-weight:800;font-size:.95rem;color:var(--br)}.mt{color:var(--mu);font-size:.7rem}
.ct{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:4px 7px 7px}
.ct a{text-align:center;text-decoration:none;font-weight:700;font-size:.74rem;padding:7px 2px;border-radius:8px;color:#fff}
.call{background:var(--br);color:var(--bi)!important}.wa{background:var(--ok)}
.em{grid-column:1/-1;text-align:center;color:var(--mu);padding:36px 10px}
dialog{border:0;border-radius:16px;padding:0;width:96vw;max-width:520px;max-height:92vh;background:var(--sf);color:var(--ink)}
dialog::backdrop{background:#000a}
.f{padding:16px;display:grid;gap:10px}.f h2{margin:0}.f label{display:grid;gap:4px;font-weight:600;font-size:.86rem}
.f input[type=checkbox]{width:auto}
.r{display:flex;flex-direction:column;gap:10px}.pw{position:relative}.pw input{padding-right:42px}
.eye{position:absolute;right:3px;top:50%;transform:translateY(-50%);background:none;border:0;cursor:pointer;font-size:1.1rem;padding:6px}
.err{color:#c62828;font-size:.84rem;margin:0;min-height:1em}
.acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.pre{display:flex;gap:6px}.pre img{width:54px;height:54px;object-fit:cover;border-radius:8px}
.tabs{display:flex;gap:5px;flex-wrap:wrap;margin:12px 0}
.tbl,.box{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:grid;gap:5px}
.box{padding:14px;margin:12px 0;gap:8px}.box h2{margin:0;font-size:1.05rem}.tbl small{color:var(--mu)}
.st{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0}
.st div{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:10px 12px}.st b{font-size:1.5rem;display:block}.st small{color:var(--mu)}
.kp{font-size:1.8rem;font-weight:800}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;z-index:60;font-weight:600;max-width:92vw;text-align:center}
.hide{display:none!important}
footer{text-align:center;color:var(--mu);font-size:.8rem;padding:0 14px 28px}
@media(min-width:480px){.r{flex-direction:row}.r>*{flex:1}}
@media(min-width:700px){header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10}.g{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}.ph{height:120px}.bd p{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.cat{font-size:.82rem;padding:4px 11px}.b{padding:9px 15px}.st{grid-template-columns:repeat(4,1fr)}}

</style>
</head>
<body>
<header><div class="w"><div class="top">
 <a class="logo" href="index.html">MAVI<b>X</b></a><span class="pill">Administrador</span>
 <a class="b" href="index.html">Ver sitio</a><a class="b" href="panel.html">Mi panel</a><button class="b" id="bOut">Salir</button>
</div></div></header>
<main class="w" id="adm"><p class="cnt">Cargando…</p></main>
<dialog id="dOwn"><div class="f"><h2>Publicar anuncio propio</h2><div id="ownForm"></div><div class="acts"><button class="b" data-close>Cerrar</button></div></div></dialog>
<div class="toast hide" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.1/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="lib.js"></script>
<script>
$("bOut").onclick=salir;
document.addEventListener("click",e=>{if(e.target.closest("[data-close]"))e.target.closest("dialog").close()});
let tab="sol";
const TABS=[["sol","Solicitudes"],["ads","Anuncios"],["ven","Vencidos"],["usr","Usuarios"],["ing","Ingresos"],["cat","Categorías"],["his","Historial"],["cfg","Ajustes"]];
const adRow=(a,x)=>`<div class="tbl"><b>${esc(a.titulo)}${a.destacado?' <span class="pill">Destacado</span>':""}</b><small>${esc(a.ciudad)} · ${esc(cat(a.cat).nombre)} · publicado ${fdate(a.creado)} · vence ${fdate(a.expira)}</small><div class="acts">${x}</div></div>`;
async function render(){
  const now=new Date().toISOString(),q=t=>sb.from(t).select("*");
  let h="";
  try{
    const[a,s,p,u]=await Promise.all([
      sb.from("anuncios").select("id",{count:"exact",head:true}).gt("expira",now),
      sb.from("solicitudes").select("id",{count:"exact",head:true}).eq("estado","pendiente"),
      sb.from("pagos").select("monto"),
      sb.from("profiles").select("id",{count:"exact",head:true})]);
    h+=`<div class="st"><div><b>${a.count??0}</b><small>Anuncios activos</small></div><div><b>${s.count??0}</b><small>Solicitudes pendientes</small></div><div><b>S/ ${(p.data||[]).reduce((t,x)=>t+x.monto,0)}</b><small>Ingresos</small></div><div><b>${u.count??0}</b><small>Usuarios</small></div></div>`;
    h+='<div class="tabs">'+TABS.map(t=>`<button class="b${t[0]===tab?" p":""}" data-t="${t[0]}">${t[1]}</button>`).join("")+'<button class="b a" id="own">+ Anuncio propio</button></div>';
    if(tab==="sol"){const{data}=await sb.from("solicitudes").select("*,profiles(username)").eq("estado","pendiente").order("creado",{ascending:false}).throwOnError();
      h+=data.length?data.map(r=>`<div class="tbl"><b>${esc(r.titulo)}</b><small>De ${esc(r.profiles?.username)} · ${esc(r.ciudad)} · ${esc(cat(r.cat).nombre)} · pidió ${r.dias} días (S/ ${S.pr[r.dias]})</small><span>${esc(r.descripcion)}</span><small>Precio ${money(r.precio)} · Llamadas ${esc(r.tel)} · WhatsApp ${esc(r.wa)}${r.nota?" · Nota: "+esc(r.nota):""}</small><div class="pre">${(r.fotos||[]).map(f=>`<img alt="" src="${esc(f)}">`).join("")}</div><div class="acts"><select class="in" style="width:auto" data-d="${r.id}">${[3,7,10].map(d=>`<option value="${d}"${d===r.dias?" selected":""}>${d} días</option>`).join("")}</select><button class="b p s" data-pub="${r.id}">Pago verificado: publicar</button><button class="b d s" data-rej="${r.id}">Rechazar</button></div></div>`).join(""):'<p class="cnt">No hay solicitudes pendientes.</p>'}
    if(tab==="ads"||tab==="ven"){const v=tab==="ven",{data}=await (v?q("anuncios").lte("expira",now):q("anuncios").gt("expira",now)).order("creado",{ascending:false}).throwOnError();
      h+=data.length?data.map(a=>adRow(a,v?`<button class="b s" data-ren="${a.id}">Renovar 7 días</button><button class="b d s" data-del="${a.id}">Eliminar</button>`:`<button class="b s" data-star="${a.id}" data-v="${a.destacado?1:0}">${a.destacado?"Quitar destacado":"Destacar"}</button><button class="b s" data-ed="${a.id}">Editar</button><button class="b d s" data-del="${a.id}">Eliminar</button>`)).join(""):`<p class="cnt">No hay anuncios ${v?"vencidos":"activos"}.</p>`}
    if(tab==="usr"){const{data}=await q("profiles").order("creado",{ascending:false}).throwOnError();
      h+=data.map(x=>`<div class="tbl"><b>${esc(x.username)}${x.role==="admin"?' <span class="pill">admin</span>':""}</b><small>${esc(x.email)} · registrado ${fdate(x.creado)}</small>${x.id===S.me.id?"":`<div class="acts"><button class="b d s" data-du="${x.id}">Eliminar cuenta</button></div>`}</div>`).join("")}
    if(tab==="ing"){const{data}=await q("pagos").order("creado",{ascending:false}).throwOnError();
      h+=data.length?data.map(x=>`<div class="tbl"><b>S/ ${x.monto} · ${x.dias} días</b><small>${esc(x.titulo)} · ${fdate(x.creado)}</small></div>`).join(""):'<p class="cnt">Aún no hay pagos registrados.</p>'}
    if(tab==="cat")h+=`<div class="tbl"><div class="r"><input class="in" id="nc" placeholder="Nueva categoría"><button class="b p" id="addc" style="flex:0 0 auto">Agregar</button></div></div>`+S.cats.map(c=>`<div class="tbl"><b>${esc(c.emoji+" "+c.nombre)}</b><div class="acts"><button class="b d s" data-dc="${esc(c.id)}">Eliminar</button></div></div>`).join("");
    if(tab==="his"){const{data}=await q("historial").order("creado",{ascending:false}).limit(100).throwOnError();
      h+=data.length?data.map(x=>`<div class="tbl"><b>${esc(x.texto)}</b><small>${fdate(x.creado)}</small></div>`).join(""):'<p class="cnt">Aún no hay actividad.</p>'}
    if(tab==="cfg")h+=`<div class="tbl f"><label>WhatsApp del administrador (con 51)<input id="cw" value="${esc(S.wa)}"></label><div class="r">${[3,7,10].map(d=>`<label>${d} días (S/)<input id="p${d}" value="${S.pr[d]}"></label>`).join("")}</div><button class="b p" id="scfg">Guardar ajustes</button></div>`;
  }catch(e){h+=`<p class="err">${esc(e.message)}</p>`}
  $("adm").innerHTML=h;
}
$("adm").onclick=async e=>{
  const b=e.target.closest("button");if(!b)return;const d=b.dataset,A=(id,v)=>sb.from("anuncios").update(v).eq("id",id).throwOnError();
  try{
    if(d.t)tab=d.t;
    else if(b.id==="own"){mountForm($("ownForm"),true,()=>{$("dOwn").close();render()});return $("dOwn").showModal()}
    else if(d.pub){
      const dias=+document.querySelector(`[data-d="${d.pub}"]`).value,{data:r}=await sb.from("solicitudes").select("*").eq("id",d.pub).single().throwOnError(),exp=new Date(Date.now()+dias*DAY).toISOString();
      await sb.from("anuncios").insert({cat:r.cat,ciudad:r.ciudad,titulo:r.titulo,descripcion:r.descripcion,precio:r.precio,tel:r.tel,wa:r.wa,fotos:r.fotos,expira:exp}).throwOnError();
      await sb.from("pagos").insert({titulo:r.titulo,dias,monto:S.pr[dias]}).throwOnError();
      await sb.from("solicitudes").update({estado:"publicada",dias,expira:exp}).eq("id",d.pub).throwOnError();
      await logh(`Publicado (${dias} días): ${r.titulo}`);toast("Anuncio publicado");
    }
    else if(d.rej){await sb.from("solicitudes").update({estado:"rechazada"}).eq("id",d.rej).throwOnError();await logh("Solicitud rechazada")}
    else if(d.del){if(!confirm("¿Eliminar este anuncio?"))return;await sb.from("anuncios").delete().eq("id",d.del).throwOnError();await logh("Anuncio eliminado")}
    else if(d.star){await A(d.star,{destacado:d.v!=="1"});await logh("Cambio de destacado")}
    else if(d.ed){const n=prompt("Nuevo título");if(!n||!n.trim())return;await A(d.ed,{titulo:n.trim()});await logh("Anuncio editado: "+n.trim())}
    else if(d.ren){await A(d.ren,{creado:new Date().toISOString(),expira:new Date(Date.now()+7*DAY).toISOString()});await logh("Anuncio renovado 7 días")}
    else if(d.du){if(!confirm("¿Eliminar esta cuenta?"))return;await sb.rpc("borrar_usuario",{uid:d.du}).throwOnError();await logh("Cuenta eliminada")}
    else if(d.dc){await sb.from("categorias").delete().eq("id",d.dc).throwOnError();await logh("Categoría eliminada: "+d.dc)}
    else if(b.id==="addc"){const v=$("nc").value.trim();if(!v)return;await sb.from("categorias").insert({id:v.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\W+/g,"-"),nombre:v}).throwOnError();await logh("Categoría nueva: "+v)}
    else if(b.id==="scfg"){
      const pr={};[3,7,10].forEach(k=>pr[k]=+$("p"+k).value||S.pr[k]);
      await sb.from("config").upsert([{clave:"wa",valor:$("cw").value.replace(/\D/g,"")||S.wa},{clave:"precios",valor:pr}]).throwOnError();
      await logh("Ajustes guardados");toast("Ajustes guardados");
    }
  }catch(err){return fail(err)}
  await Promise.all([loadCats(),loadCfg()]);render();
};
(async()=>{
  try{await boot()}catch(e){return fatal(e)}
  if(!isAdm()){location.replace("index.html");return}
  render();
})();
</script>
</body>
</html>

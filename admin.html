<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Administrador | MAVIX</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛍️</text></svg>">
<link rel="stylesheet" href="estilos.css">
</head>
<body>
<header><div class="w"><div class="top">
 <a class="logo" href="index.html">MAVI<b>X</b></a><span class="pill">Administrador</span>
 <a class="b" href="index.html">Ver sitio</a><a class="b" href="panel.html">Mi panel</a><button class="b" id="bOut">Salir</button>
</div></div></header>
<main class="w" id="adm"><p class="cnt">Cargando…</p></main>
<div class="toast hide" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.1/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="lib.js"></script>
<script>
$("bOut").onclick=salir;
let tab="sol",lastN=null,pend=0;
const TABS=[["sol","Solicitudes"],["ads","Anuncios"],["ven","Vencidos"],["usr","Cuentas"],["ing","Ganancias"],["his","Historial"],["cfg","Ajustes"],["new","+ Crear publicación"]];
const catN=r=>cat(r.cat).nombre+(r.sub?" · "+r.sub:"");
const adRow=(a,x)=>`<div class="tbl"><b>${esc(a.titulo)}${a.destacado?' <span class="pill">Destacado</span>':""}${a.propio?' <span class="pill">Propio</span>':""}</b><small>${esc(a.ciudad)} · ${esc(catN(a))} · publicado ${fdate(a.creado)} · vence ${fdate(a.expira)}</small><div class="acts">${x}</div></div>`;
const solRow=r=>{
 const pf=r.profiles,mis=pf&&pf.ciudad!==r.ciudad,ap=r.estado==="aprobada";
 return`<div class="tbl"><b>${esc(r.titulo)} <span class="pill ${ap?"bl":"wt"}">${esc(r.codigo)}</span></b>
 <small>De ${esc(pf?.username||"?")} (cuenta de ${esc(pf?.ciudad||"?")}) · anuncio en ${esc(r.ciudad)} · ${esc(catN(r))} · pidió ${r.dias} días (S/ ${S.pr[r.dias]})</small>
 ${mis?'<div class="warn">⚠️ La localización del anuncio no coincide con la de la cuenta. Revísalo bien.</div>':""}
 <span>${esc(r.descripcion)}</span><small>Llamadas ${esc(r.tel)} · WhatsApp ${esc(r.wa)}</small>
 <div class="vp">${card(r,true)}</div>
 <div class="acts">${ap?`<select class="in" style="width:auto" data-d="${r.id}">${[3,7,10].map(d=>`<option value="${d}"${d===r.dias?" selected":""}>${d} días</option>`).join("")}</select><button class="b g s" data-pub="${r.id}">Pago verificado: activar</button>`
 :`<button class="b p s" data-ok="${r.id}">Aprobar</button>`}<button class="b d s" data-rej="${r.id}">Rechazar</button></div></div>`};

async function render(){
 const now=new Date().toISOString(),q=t=>sb.from(t).select("*");let h="";
 try{
  const res=await Promise.all([
   sb.from("anuncios").select("id",{count:"exact",head:true}).gt("expira",now),
   sb.from("solicitudes").select("id",{count:"exact",head:true}).eq("estado","pendiente"),
   sb.from("pagos").select("monto"),
   sb.from("profiles").select("id",{count:"exact",head:true})]);
  res.forEach(x=>{if(x.error)throw x.error});
  const[a,s,p,u]=res;pend=s.count??0;lastN=pend;document.title=(pend?"("+pend+") ":"")+"Administrador | MAVIX";
  h+=`<div class="st"><div><b>${a.count??0}</b><small>Anuncios activos</small></div><div><b>${pend}</b><small>Solicitudes pendientes</small></div><div><b>S/ ${(p.data||[]).reduce((t,x)=>t+x.monto,0)}</b><small>Ganancias</small></div><div><b>${u.count??0}</b><small>Cuentas</small></div></div>`;
  h+='<div class="tabs">'+TABS.map(t=>`<button class="b${t[0]===tab?" p":""}" data-t="${t[0]}">${t[1]}${t[0]==="sol"&&pend?" 🔔"+pend:""}</button>`).join("")+"</div>";
  if(tab==="sol"){
   const{data}=await sb.from("solicitudes").select("*,profiles(username,ciudad)").in("estado",["pendiente","aprobada"]).order("creado",{ascending:false}).throwOnError();
   const pe=data.filter(r=>r.estado==="pendiente"),ap=data.filter(r=>r.estado==="aprobada");
   h+=`<div class="box"><h2>Por aprobar</h2>${pe.map(solRow).join("")||'<small>No hay solicitudes pendientes.</small>'}</div>
   <div class="box"><h2>Aprobadas: esperando pago</h2>${ap.map(solRow).join("")||"<small>Ninguna por ahora.</small>"}</div>`;
  }
  if(tab==="ads"||tab==="ven"){
   const v=tab==="ven",{data}=await (v?q("anuncios").lte("expira",now):q("anuncios").gt("expira",now)).order("creado",{ascending:false}).throwOnError();
   h+=data.length?data.map(a=>adRow(a,v?`<button class="b s" data-ren="${a.id}">Renovar 7 días</button><button class="b d s" data-del="${a.id}">Eliminar</button>`
    :`<button class="b s" data-star="${a.id}" data-v="${a.destacado?1:0}">${a.destacado?"Quitar destacado":"Destacar"}</button><button class="b s" data-ed="${a.id}">Editar título</button><button class="b d s" data-del="${a.id}">Eliminar</button>`)).join(""):`<p class="cnt">No hay anuncios ${v?"vencidos":"activos"}.</p>`;
  }
  if(tab==="usr"){
   const{data}=await q("profiles").order("creado",{ascending:false}).throwOnError();
   h+=data.map(x=>`<div class="tbl"><b>${esc(x.username)}${x.role==="admin"?' <span class="pill">admin</span>':""}</b><small>${esc(x.email)} · 📍 ${esc(x.ciudad)} · registrado ${fdate(x.creado)}</small>${x.id===S.me.id?"":`<div class="acts"><button class="b d s" data-du="${x.id}" data-n="${esc(x.username)}">Eliminar cuenta</button></div>`}</div>`).join("");
  }
  if(tab==="ing"){
   const{data}=await q("pagos").order("creado",{ascending:false}).throwOnError(),tot=data.reduce((t,x)=>t+x.monto,0);
   h+=`<div class="st"><div><b>S/ ${tot}</b><small>Ganancias totales</small></div><div><b>${data.length}</b><small>Publicaciones pagadas</small></div></div>
   <div class="st">${[3,7,10].map(d=>{const z=data.filter(x=>x.dias===d);return`<div><b>S/ ${z.reduce((t,x)=>t+x.monto,0)}</b><small>${z.length} de ${d} días</small></div>`}).join("")}</div>`;
   h+=data.length?data.map(x=>`<div class="tbl"><b>S/ ${x.monto} · ${x.dias} días</b><small>${esc(x.titulo)} · ${fdate(x.creado)}</small></div>`).join(""):'<p class="cnt">Aún no hay pagos registrados.</p>';
  }
  if(tab==="his"){
   const{data}=await q("historial").order("creado",{ascending:false}).limit(100).throwOnError();
   h+=data.length?data.map(x=>`<div class="tbl"><b>${esc(x.texto)}</b><small>${fdate(x.creado)}</small></div>`).join(""):'<p class="cnt">Aún no hay actividad.</p>';
  }
  if(tab==="cfg")h+=`<div class="tbl f"><label>Número de pagos y WhatsApp (9 dígitos, sin 51)<input id="cn" value="${esc(S.num)}" inputmode="numeric" maxlength="9"></label><div class="r">${[3,7,10].map(d=>`<label>${d} días (S/)<input id="p${d}" type="number" min="0" value="${S.pr[d]}"></label>`).join("")}</div><button class="b p" id="scfg">Guardar ajustes</button></div>`;
  if(tab==="new")h+='<div class="box"><h2>Crear publicación propia</h2><small>Se publica al instante, sin pago y sin contar en las ganancias.</small><div id="ownForm"></div></div>';
 }catch(e){h+=`<p class="err">${esc(e.message)}</p>`}
 $("adm").innerHTML=h;
 if(tab==="new"&&$("ownForm"))mountForm($("ownForm"),true,()=>{tab="ads";render()});
}

$("adm").onclick=async e=>{
 const b=e.target.closest("button");if(!b)return;const d=b.dataset;
 const A=(id,v)=>sb.from("anuncios").update(v).eq("id",id).throwOnError();
 if(d.t){tab=d.t;return render()}
 b.disabled=true;
 try{
  if(d.ok){await sb.from("solicitudes").update({estado:"aprobada"}).eq("id",d.ok).throwOnError();await logh("Solicitud aprobada");toast("Aprobada. Ahora el cliente debe pagar")}
  else if(d.rej){if(!confirm("¿Rechazar esta solicitud?"))return b.disabled=false;await sb.from("solicitudes").update({estado:"rechazada"}).eq("id",d.rej).throwOnError();await logh("Solicitud rechazada")}
  else if(d.pub){const dias=+document.querySelector(`[data-d="${d.pub}"]`).value;await sb.rpc("publicar_solicitud",{sid:d.pub,d:dias}).throwOnError();toast("Anuncio activado")}
  else if(d.del){if(!confirm("¿Eliminar este anuncio?"))return b.disabled=false;await sb.from("anuncios").delete().eq("id",d.del).throwOnError();await logh("Anuncio eliminado")}
  else if(d.star){await A(d.star,{destacado:d.v!=="1"});await logh("Cambio de destacado")}
  else if(d.ed){const n=prompt("Nuevo título (5 a 70 caracteres)");if(!n||n.trim().length<5)return b.disabled=false;await A(d.ed,{titulo:n.trim().slice(0,70)});await logh("Anuncio editado: "+n.trim())}
  else if(d.ren){await A(d.ren,{creado:new Date().toISOString(),expira:new Date(Date.now()+7*DAY).toISOString()});await logh("Anuncio renovado 7 días")}
  else if(d.du){if(!confirm("¿Eliminar la cuenta de "+d.n+" y todas sus solicitudes?"))return b.disabled=false;await sb.rpc("borrar_usuario",{uid:d.du}).throwOnError();toast("Cuenta eliminada")}
  else if(b.id==="scfg"){
   const pr={};[3,7,10].forEach(k=>pr[k]=Math.max(0,Math.round(+$("p"+k).value))||S.pr[k]);
   const n=$("cn").value.replace(/\D/g,"").slice(-9);if(n.length!==9){b.disabled=false;return toast("El número debe tener 9 dígitos")}
   await sb.from("config").upsert([{clave:"numero",valor:n},{clave:"precios",valor:pr}]).throwOnError();await logh("Ajustes guardados");toast("Ajustes guardados");
  }
 }catch(err){b.disabled=false;return fail(err)}
 await loadCfg();render();
};

(async()=>{
 try{await boot()}catch(e){return fatal(e)}
 if(!isAdm()){location.replace("index.html");return}
 render();
 sb.auth.onAuthStateChange(ev=>{if(ev==="SIGNED_OUT")location.replace("index.html")});
 /* aviso de nuevas solicitudes cada 30 s */
 setInterval(async()=>{
  const{count,error}=await sb.from("solicitudes").select("id",{count:"exact",head:true}).eq("estado","pendiente");
  if(error)return;
  if(lastN!==null&&count>lastN){toast("🔔 Nueva solicitud de publicación");if(tab==="sol")render()}
  lastN=count;document.title=(count?"("+count+") ":"")+"Administrador | MAVIX";
 },30000);
})();
</script>
</body>
</html>

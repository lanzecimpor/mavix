<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>MAVIX | Anuncios clasificados</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛍️</text></svg>">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f1f6f5;--sf:#fff;--ink:#0f2421;--mu:#587570;--ln:#d5e4e1;--br:#0f766e;--bi:#fff;--ac:#f59e0b;--ok:#15803d;--chip:#dff0ed;
font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#0b1716;--sf:#12231f;--ink:#e8f5f2;--mu:#8fb0aa;--ln:#25403b;--br:#2dd4bf;--bi:#04201c;--chip:#1d3732}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);line-height:1.4}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--sf);z-index:20}
button,input,select,textarea{font:inherit;color:inherit}
header{background:var(--sf);border-bottom:1px solid var(--ln)}
.w{max-width:1000px;margin:0 auto;padding:0 12px}
.top{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;padding:10px 0}
.logo{font-weight:800;font-size:1.45rem;letter-spacing:-.04em;color:var(--br);margin-right:auto;text-decoration:none}.logo b{color:var(--ac)}
.b{border:0;border-radius:10px;padding:8px 12px;font-size:.88rem;font-weight:700;cursor:pointer;background:var(--chip);white-space:nowrap;text-decoration:none;color:var(--ink);display:inline-block}
.b.p{background:var(--br);color:var(--bi)}.b.a{background:var(--ac);color:#241700}.b.s{padding:5px 10px;font-size:.8rem}.b.d{background:#c62828;color:#fff}
.b:disabled{opacity:.6;cursor:wait}
:is(button,input,select,textarea,a):focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.pill{font-size:.72rem;background:var(--chip);border-radius:99px;padding:3px 9px;font-weight:700}
.pill.ok{background:var(--ok);color:#fff}.pill.wt{background:var(--ac);color:#241700}.pill.no{background:#c62828;color:#fff}
.bar{display:flex;gap:8px;padding-bottom:8px}
.bar input,.bar select,.f input,.f select,.f textarea,.in{background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:9px 11px;min-width:0;width:100%}
.bar input{flex:1}.bar select{width:auto;max-width:42%}
.cats{display:flex;gap:4px;overflow-x:auto;padding-bottom:9px;scrollbar-width:none}
.cat{border:0;background:var(--chip);border-radius:7px;padding:3px 9px;font-size:.76rem;cursor:pointer;white-space:nowrap;font-weight:600}
.cat[aria-pressed="true"]{background:var(--br);color:var(--bi)}
.cnt{color:var(--mu);font-size:.85rem;margin:12px 0 8px}
.g{display:grid;gap:8px;grid-template-columns:repeat(2,minmax(0,1fr));padding-bottom:40px}
.cd{background:var(--sf);border:1px solid var(--ln);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.ph{height:74px;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:1.7rem;position:relative}
.ph[data-id]{cursor:pointer}.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tg{position:absolute;left:3px;top:3px;font-size:.55rem;font-weight:800;background:var(--ac);color:#241700;padding:1px 7px;border-radius:99px}
.ph i{position:absolute;right:3px;bottom:3px;background:#000a;color:#fff;font-style:normal;font-size:.55rem;padding:0 5px;border-radius:99px}
.bd{padding:5px 6px 3px;display:flex;flex-direction:column;gap:1px;flex:1;min-width:0}
.bd h3{margin:0;font-size:.78rem;line-height:1.2;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bd p{display:none;margin:0;color:var(--mu);font-size:.82rem}
.pr{font-weight:800;font-size:.86rem;color:var(--br)}.mt{color:var(--mu);font-size:.65rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ct{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:3px 5px 5px}
.ct a{text-align:center;text-decoration:none;font-weight:700;font-size:.9rem;line-height:1;padding:7px 0;border-radius:7px;color:#fff}
.call{background:var(--br);color:var(--bi)!important}.wa{background:var(--ok)}
.em{grid-column:1/-1;text-align:center;color:var(--mu);padding:36px 10px}
dialog{border:0;border-radius:16px;padding:0;width:96vw;max-width:520px;max-height:92vh;background:var(--sf);color:var(--ink)}
dialog::backdrop{background:#000a}
.f{padding:16px;display:grid;gap:10px}.f h2{margin:0}.f label{display:grid;gap:4px;font-weight:600;font-size:.86rem}
.f input[type=checkbox]{width:auto}
.r{display:flex;flex-direction:column;gap:10px}.pw{position:relative}.pw input{padding-right:42px}
.eye{position:absolute;right:3px;top:50%;transform:translateY(-50%);background:none;border:0;cursor:pointer;font-size:1.1rem;padding:6px}
.err{color:#c62828;font-size:.84rem;margin:0;min-height:1em}
.acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.pre{display:flex;gap:6px}.pre img{width:54px;height:54px;object-fit:cover;border-radius:8px}
.tabs{display:flex;gap:5px;flex-wrap:wrap;margin:12px 0}
.tbl,.box{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:grid;gap:5px}
.box{padding:14px;margin:12px 0;gap:8px}.box h2{margin:0;font-size:1.05rem}.tbl small{color:var(--mu)}
.st{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0}
.st div{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:10px 12px}.st b{font-size:1.5rem;display:block}.st small{color:var(--mu)}
.kp{font-size:1.8rem;font-weight:800}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;z-index:60;font-weight:600;max-width:92vw;text-align:center}
.hide{display:none!important}
footer{text-align:center;color:var(--mu);font-size:.8rem;padding:0 14px 28px}
@media(min-width:480px){.r{flex-direction:row}.r>*{flex:1}}
@media(min-width:700px){header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10}.g{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.ph{height:84px;font-size:1.9rem}.bd h3{font-size:.8rem}.pr{font-size:.88rem}.mt{font-size:.66rem}.cat{font-size:.82rem;padding:4px 11px}.b{padding:9px 15px}.st{grid-template-columns:repeat(4,1fr)}}

</style>
</head>
<body>
<header><div class="w">
 <div class="top"><a class="logo" href="index.html">MAVI<b>X</b></a><span id="who" class="pill hide"></span>
  <a class="b a" id="bReq" href="panel.html">Publicar</a><a class="b hide" id="bAdm" href="admin.html">Admin</a><button class="b" id="bAuth">Ingresar</button></div>
 <div class="bar"><input id="q" type="search" placeholder="Buscar anuncios" aria-label="Buscar"><select id="ciu" aria-label="Ciudad"></select></div>
 <div class="cats" id="cats"></div>
</div></header>
<main class="w"><div class="box hide" id="aviso"></div><p class="cnt" id="cnt">Cargando…</p><section class="g" id="grid"></section></main>
<footer>Los anuncios son anónimos. Antes de pagar, conoce el producto o servicio en persona.</footer>

<dialog id="dAuth"><div class="f">
 <div class="acts" style="justify-content:flex-start"><button class="b p" id="tLog">Iniciar sesión</button><button class="b" id="tReg">Crear cuenta</button></div>
 <div id="fLog" class="f" style="padding:0">
  <label>Usuario o correo<input id="lU" autocomplete="username"></label>
  <label>Contraseña<span class="pw"><input id="lP" type="password" autocomplete="current-password"><button class="eye" type="button" data-eye="lP" aria-label="Mostrar contraseña">👁</button></span></label>
  <p class="err" id="lE"></p><button class="b p" id="goLog">Entrar</button></div>
 <div id="fReg" class="f hide" style="padding:0">
  <label>Nombre de usuario<input id="rU" autocomplete="username"></label>
  <label>Correo Gmail<input id="rE" type="email" placeholder="tunombre@gmail.com"></label>
  <label>Contraseña<span class="pw"><input id="rP" type="password" autocomplete="new-password"><button class="eye" type="button" data-eye="rP" aria-label="Mostrar contraseña">👁</button></span></label>
  <label>Confirmar contraseña<span class="pw"><input id="rC" type="password" autocomplete="new-password"><button class="eye" type="button" data-eye="rC" aria-label="Mostrar contraseña">👁</button></span></label>
  <p class="err" id="rErr"></p><button class="b p" id="goReg">Crear cuenta</button></div>
 <div class="acts"><button class="b" data-close>Cerrar</button></div>
</div></dialog>
<div class="toast hide" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.1/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="lib.js"></script>
<script>
const CATS_BASE=[{id:"trabajos",nombre:"Trabajos",emoji:"💼"},{id:"alquiler",nombre:"Alquiler",emoji:"🔑"},{id:"terrenos",nombre:"Terrenos",emoji:"🌄"},{id:"inmuebles",nombre:"Inmuebles",emoji:"🏠"},{id:"servicios",nombre:"Servicios",emoji:"🛠️"},{id:"otros",nombre:"Otros",emoji:"📦"}];
const st={cat:"",ciu:S.ciu,q:"",ads:[]};
async function loadAds(){const{data,error}=await sb.from("anuncios").select("*").gt("expira",new Date().toISOString()).order("creado",{ascending:false}).limit(400);if(error)throw error;st.ads=data||[]}
function renderCats(){$("cats").innerHTML=[{id:"",nombre:"Todas",emoji:"✨"},...S.cats].map(c=>`<button class="cat" aria-pressed="${st.cat===c.id}" data-c="${esc(c.id)}">${esc(c.emoji+" "+c.nombre)}</button>`).join("")}
const card=a=>{const c=cat(a.cat),f=a.fotos||[];return`<article class="cd"><div class="ph" ${f.length>1?`data-id="${a.id}"`:""}>${f[0]?`<img loading="lazy" alt="" src="${esc(f[0])}">`:c.emoji}${a.demo?'<span class="tg">Ejemplo</span>':a.destacado?'<span class="tg">Destacado</span>':""}${f.length>1?`<i>${f.length} fotos</i>`:""}</div><div class="bd"><span class="pr">${money(a.precio)}</span><h3>${esc(a.titulo)}</h3><p>${esc(a.descripcion)}</p><span class="mt">${esc(a.ciudad)} · ${hace(a.creado)}</span></div><div class="ct"><a class="call" aria-label="Llamar" title="Llamar" href="tel:+51${esc(a.tel)}">📞</a><a class="wa" aria-label="WhatsApp" title="WhatsApp" target="_blank" rel="noopener" href="https://wa.me/51${esc(a.wa)}?text=${encodeURIComponent("Hola, vi tu anuncio en MAVIX: "+a.titulo)}">💬</a></div></article>`};
function renderGrid(){
  const q=st.q.toLowerCase().trim();
  const r=st.ads.filter(a=>(!st.cat||a.cat===st.cat)&&(!st.ciu||a.ciudad===st.ciu)&&(!q||(a.titulo+" "+a.descripcion).toLowerCase().includes(q)));
  $("cnt").textContent=r.length+(r.length===1?" anuncio":" anuncios")+(st.ciu?" en "+st.ciu:" en todo el Perú");
  $("grid").innerHTML=r.length?r.map(card).join(""):'<div class="em">No hay anuncios con estos filtros. Prueba otra ciudad o publica el primero.</div>';
}
const refresh=()=>{renderCats();renderGrid()};
$("cats").onclick=e=>{const b=e.target.closest(".cat");if(b){st.cat=b.dataset.c;refresh()}};
$("q").oninput=e=>{st.q=e.target.value;renderGrid()};
$("ciu").onchange=e=>{st.ciu=e.target.value;localStorage.setItem("mx_ciu",st.ciu);renderGrid()};
$("grid").onclick=e=>{const p=e.target.closest(".ph[data-id]");if(!p)return;const a=st.ads.find(x=>x.id===p.dataset.id);if(!a)return;const i=((+p.dataset.i||0)+1)%a.fotos.length;p.dataset.i=i;p.querySelector("img").src=a.fotos[i]};

/* sesión */
function renderSess(){
  $("who").classList.toggle("hide",!S.prof);$("who").textContent=S.prof?S.prof.username:"";
  $("bAdm").classList.toggle("hide",!isAdm());$("bAuth").textContent=S.me?"Salir":"Ingresar";
}
$("bReq").onclick=e=>{if(!S.me){e.preventDefault();toast("Inicia sesión para publicar un anuncio");openAuth()}};
const openAuth=()=>{$("lE").textContent="";$("rErr").textContent="";$("dAuth").showModal()};
$("bAuth").onclick=async()=>{if(S.me){await sb.auth.signOut();toast("Sesión cerrada")}else openAuth()};
$("tLog").onclick=()=>{$("fLog").classList.remove("hide");$("fReg").classList.add("hide");$("tLog").className="b p";$("tReg").className="b"};
$("tReg").onclick=()=>{$("fReg").classList.remove("hide");$("fLog").classList.add("hide");$("tReg").className="b p";$("tLog").className="b"};
document.addEventListener("click",e=>{
  const y=e.target.closest("[data-eye]");if(y){const i=$(y.dataset.eye);i.type=i.type==="password"?"text":"password";y.textContent=i.type==="password"?"👁":"🙈"}
  if(e.target.closest("[data-close]"))e.target.closest("dialog").close();
});
$("goReg").onclick=async()=>{
  const u=$("rU").value.trim(),m=$("rE").value.trim().toLowerCase(),p=$("rP").value,E=$("rErr");
  if(u.length<3)return E.textContent="El usuario debe tener al menos 3 caracteres.";
  if(!/^[a-z0-9._+-]+@gmail\.com$/.test(m))return E.textContent="Escribe un correo Gmail válido (termina en @gmail.com).";
  if(p.length<6)return E.textContent="La contraseña debe tener al menos 6 caracteres.";
  if(p!==$("rC").value)return E.textContent="Las contraseñas no coinciden.";
  E.textContent="Creando cuenta…";
  const{data,error}=await sb.auth.signUp({email:m,password:p,options:{data:{username:u},emailRedirectTo:location.origin+location.pathname}});
  if(error)return E.textContent=/database|already|duplicate/i.test(error.message)?"Ese usuario o correo ya existe.":error.message;
  $("dAuth").close();toast(data.session?"Cuenta creada. Bienvenido, "+u:"Cuenta creada. Revisa tu Gmail para confirmarla.");
};
$("goLog").onclick=async()=>{
  let k=$("lU").value.trim();const E=$("lE");E.textContent="Entrando…";
  if(!k.includes("@")){const{data}=await sb.rpc("email_de_usuario",{u:k});if(!data)return E.textContent="Usuario o contraseña incorrectos.";k=data}
  const{error}=await sb.auth.signInWithPassword({email:k,password:$("lP").value});
  if(error)return E.textContent=/confirm/i.test(error.message)?"Confirma tu correo antes de entrar.":"Usuario o contraseña incorrectos.";
  $("dAuth").close();toast("Sesión iniciada");
};

(async()=>{
  opts($("ciu"),CIU,"Todo el Perú");$("ciu").value=st.ciu;
  let dbOk=true,detalle="";
  try{await boot();await loadAds()}catch(e){console.error(e);dbOk=false;detalle=e.message||String(e)}
  if(!S.cats.length)S.cats=CATS_BASE;
  if(!dbOk){
    const h=Date.now();
    st.ads=[["servicios","Juliaca","Gasfitero a domicilio","Fugas, termas y destapes. Atención el mismo día.",""],["trabajos","Lima","Se necesita vendedora","Tienda de ropa, turno completo.","1500"],["alquiler","Arequipa","Cuarto amoblado","Incluye agua, luz e internet.","450"],["terrenos","Piura","Terreno de 200 m²","Plano y esquina, con título.","85000"],["inmuebles","Cusco","Casa de 3 pisos","150 m² y cochera para 2 autos.","260000"],["otros","Trujillo","Moto lineal 150 cc","Papeles al día, un solo dueño.","3800"]].map((x,i)=>({id:"demo"+i,cat:x[0],ciudad:x[1],titulo:x[2],descripcion:x[3],precio:x[4],tel:"999000000",wa:"999000000",fotos:[],creado:new Date(h-i*36e5*5).toISOString(),demo:true}));
    $("aviso").classList.remove("hide");
    $("aviso").innerHTML='<h2>Vista previa con anuncios de ejemplo</h2><small style="color:var(--mu)">La página aún no puede leer tu base de datos. Ejecuta <b>schema.sql</b> en Supabase (SQL Editor) y recarga. Detalle técnico: '+esc(detalle)+'</small>';
  }
  renderSess();refresh();
  sb.auth.onAuthStateChange((ev,s)=>{if(ev==="SIGNED_IN"||ev==="SIGNED_OUT")setTimeout(async()=>{await loadProfile(s);renderSess()},0)});
  if(location.hash==="#ingresar"&&!S.me)openAuth();
})();
</script>
</body>
</html>

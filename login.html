<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tablón – Entrar</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilos.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="supabase.js"></script></head>
<body><nav id="nav"></nav>
<main>
  <div class="caja">
    <div class="tabs">
      <button id="t-in" class="on" type="button">Ingresar</button>
      <button id="t-reg" type="button">Crear cuenta</button>
    </div>
    <div id="f">
      <div id="g-nombre" hidden><label for="nombre">Nombre</label><input id="nombre" autocomplete="name"></div>
      <label for="email">Correo</label><input id="email" type="email" autocomplete="email">
      <label for="pass">Contraseña</label><input id="pass" type="password" minlength="6" autocomplete="current-password">
      <p style="margin:18px 0 0"><button id="ok" class="principal" type="button">Ingresar</button></p>
      <div id="msg" class="msg" hidden role="status"></div>
    </div>
  </div>
</main>
<script>
pintarNav();
let registro = false;
const $ = id => document.getElementById(id);
function modo(r) {
  registro = r;
  $("t-in").classList.toggle("on", !r); $("t-reg").classList.toggle("on", r);
  $("g-nombre").hidden = !r; $("ok").textContent = r ? "Crear cuenta" : "Ingresar"; $("msg").hidden = true;
}
$("t-in").onclick = () => modo(false);
$("t-reg").onclick = () => modo(true);
function aviso(t, error) { const m = $("msg"); m.textContent = t; m.className = "msg" + (error ? " error" : ""); m.hidden = false; }
async function irA(user) { location.href = (await getRol(user)) === "admin" ? "admin.html" : "publicar.html"; }

$("ok").onclick = async () => {
  const email = $("email").value.trim(), password = $("pass").value;
  if (!email || password.length < 6) return aviso("Escribe tu correo y una contraseña de al menos 6 caracteres.", true);
  $("ok").disabled = true;
  if (registro) {
    const { data, error } = await sb.auth.signUp({ email, password, options: { data: { nombre: $("nombre").value.trim() } } });
    $("ok").disabled = false;
    if (error) return aviso(error.message, true);
    if (data.session) return irA(data.user);
    return aviso("Cuenta creada. Revisa tu correo para confirmarla y luego ingresa.");
  }
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  $("ok").disabled = false;
  if (error) return aviso("Correo o contraseña incorrectos.", true);
  irA(data.user);
};
</script></body></html>
